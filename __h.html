<!doctype html><meta charset="utf-8">
<style>html,body{margin:0}iframe{width:360px;height:760px;border:0}</style>
<iframe id="f" src="gallery.html"></iframe>
<div id="AUDIT">pending</div>
<script>
document.getElementById('f').addEventListener('load', function () {
  setTimeout(function () {
    var w = document.getElementById('f').contentWindow;
    var d = w.document;
    var vw = w.innerWidth;
    var out = ['vw=' + vw, 'docW=' + d.documentElement.scrollWidth];
    var bad = [];
    d.querySelectorAll('body *').forEach(function (el) {
      if (el.closest('.marquee,.gal__row,.ctable,.tst__viewport,.nav,.lbox')) return;
      var r = el.getBoundingClientRect();
      if (r.width > vw + 1 && r.height > 0) {
        var id = el.tagName.toLowerCase() +
          (typeof el.className === 'string' && el.className
            ? '.' + el.className.trim().split(/\s+/).slice(0,2).join('.') : '');
        var e = id + '(' + Math.round(r.width) + ')';
        if (bad.indexOf(e) < 0 && bad.length < 8) bad.push(e);
      }
    });
    out.push('over=[' + bad.join(' ') + ']');
    document.getElementById('AUDIT').textContent = out.join('  ');
  }, 1400);
});
</script>
